[package]
name = "oxy-metadata-parser"
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["jpeg", "tiff", "png", "webp", "heif", "gif", "bmp", "xmp", "iptc", "icc", "quicktime"]
jpeg = []
tiff = []
png = []
webp = []
heif = []
gif = []
bmp = []
xmp = []
iptc = []
icc = []
quicktime = ["heif"]
# Kept as empty compatibility switches because the imported API gates its
# document/FFI surface behind these names. OxyViewer does not ship that code.
pdf = []
ffi = []
internals = []

[dependencies]
memmap2 = "0.9"
miniz_oxide = "0.9"

[dev-dependencies]
tempfile.workspace = true

[lib]
name = "oxy_metadata_parser"
path = "src/lib.rs"
