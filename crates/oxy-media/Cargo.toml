[package]
name = "oxy-media"
build = "build.rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
bench-tools = []

[[bin]]
name = "heif_decode_bench"
path = "src/bin/heif_decode_bench.rs"
required-features = ["bench-tools"]

[[bin]]
name = "heif_display_bench"
path = "src/bin/heif_display_bench.rs"
required-features = ["bench-tools"]

[[bin]]
name = "heif_gpu_probe"
path = "src/bin/heif_gpu_probe.rs"
required-features = ["bench-tools"]

[[bin]]
name = "raw_display_bench"
path = "src/bin/raw_display_bench.rs"
required-features = ["bench-tools"]

[dependencies]
fs2.workspace = true
image.workspace = true
lcms2.workspace = true
libc.workspace = true
libheif-rs.workspace = true
oxy-domain = { path = "../oxy-domain" }
oxy-fs = { path = "../oxy-fs" }
oxy-runtime = { path = "../oxy-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
] }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
