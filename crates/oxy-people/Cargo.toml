[package]
name = "oxy-people"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Standalone research fallback, never selected by the desktop application.
winml-backup = []

[dependencies]
image.workspace = true
oxy-domain = { path = "../oxy-domain" }
oxy-fs = { path = "../oxy-fs" }
oxy-runtime = { path = "../oxy-runtime" }
oxy-store = { path = "../oxy-store" }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
ureq = { version = "3.4", default-features = false, features = ["native-tls", "win-system-proxy"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "coreml", "api-27"] }
