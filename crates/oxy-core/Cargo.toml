[package]
name = "oxy-core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
winml-backup = []

[dependencies]
oxy-media = { path = "../oxy-media" }
oxy-metadata-parser = { path = "../oxy-metadata-parser" }
image.workspace = true
libheif-rs.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlite-vec.workspace = true
tempfile.workspace = true
thiserror.workspace = true
trash.workspace = true
ureq = { version = "3.4", default-features = false, features = ["native-tls", "win-system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "coreml", "api-27"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_System_Com",
] }
