[package]
name = "oxyviewer"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
name = "oxyviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile.workspace = true
oxy-domain = { path = "../../../crates/oxy-domain" }
oxy-fs = { path = "../../../crates/oxy-fs" }
oxy-library = { path = "../../../crates/oxy-library" }
oxy-media = { path = "../../../crates/oxy-media" }
oxy-metadata = { path = "../../../crates/oxy-metadata" }
oxy-runtime = { path = "../../../crates/oxy-runtime" }
flate2 = "1.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tar = "0.4"
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
