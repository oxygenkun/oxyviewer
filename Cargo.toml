[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/oxy-domain",
  "crates/oxy-faces",
  "crates/oxy-fs",
  "crates/oxy-library",
  "crates/oxy-media",
  "crates/oxy-userdata",
  "crates/oxy-metadata",
  "crates/oxy-metadata-parser",
  "crates/oxy-runtime",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-OxyViewer-Commercial"
rust-version = "1.85"
version = "0.1.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
large_include_file = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
mem_forget = "deny"
mod_module_files = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
todo = "deny"
unimplemented = "deny"
uninlined_format_args = "deny"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lcms2 = { version = "6.1", features = ["static"] }
libc = "0.2"
libheif-rs = { version = "2.7", default-features = false, features = ["v1_21"] }
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
trash = "5.2"
walkdir = "2.5"
windows = "0.61"

# Media decoding, pixel conversion, and JPEG encoding are intentionally hot
# even in Debug builds. Optimizing only these crates keeps fast application
# rebuilds while making Debug performance diagnostics representative.
[profile.dev.package.oxy-media]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

# ONNX inference is pure Rust and is unusably slow unoptimized: a Debug test run
# of `oxy-faces` spends minutes in the tensor kernels. Optimizing the analyzer
# and the tract compute crates keeps rebuilds of the rest of the workspace fast
# while making the reference-parity tests practical.
[profile.dev.package.oxy-faces]
opt-level = 2

[profile.dev.package.tract-core]
opt-level = 2

[profile.dev.package.tract-linalg]
opt-level = 2

[profile.dev.package.tract-data]
opt-level = 2

