[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/oxy-domain",
  "crates/oxy-fs",
  "crates/oxy-library",
  "crates/oxy-media",
  "crates/oxy-metadata",
  "crates/oxy-runtime",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lcms2 = { version = "6.1", features = ["static"] }
libheif-rs = { version = "2.7", default-features = false, features = ["v1_21", "embedded-libheif"] }
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
trash = "5.2"
walkdir = "2.5"
windows = "0.61"

# Media decoding, pixel conversion, and JPEG encoding are intentionally hot
# even in Debug builds. Optimizing only these crates keeps fast application
# rebuilds while making Debug performance diagnostics representative.
[profile.dev.package.oxy-media]
opt-level = 2

[profile.dev.package.image]
opt-level = 2
