[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/oxy-domain",
  "crates/oxy-fs",
  "crates/oxy-library",
  "crates/oxy-media",
  "crates/oxy-metadata",
  "crates/oxy-runtime",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
trash = "5.2"
walkdir = "2.5"

