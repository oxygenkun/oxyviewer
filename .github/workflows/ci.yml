name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_INCREMENTAL: 1
      - name: cargo test
        run: cargo test --workspace
        env:
          CARGO_INCREMENTAL: 1

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  build:
    name: Build (${{ matrix.os }})
    needs: [lint, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Restore Windows dependency cache
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-libheif-1.23.3-aom-x64-windows-static-md-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-libheif-1.23.3-aom-x64-windows-static-md-
      - name: Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif[aom]:x64-windows-static-md" --overlay-ports="${{ github.workspace }}\3rdpart\vcpkg-ports"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cross-platform HIF detail and media regression tests
        run: cargo test -p oxy-media -p oxy-metadata -p oxyviewer
      - name: Build Tauri app
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: pnpm tauri build
      - name: Build Tauri app (App)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app
      - name: Build Tauri app (MSI)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: pnpm tauri build --bundles msi
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-macOS-${{ runner.arch }}-App
          path: target/release/bundle/macos/*.app
      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-Windows-${{ runner.arch }}-MSI
          path: target/release/bundle/msi/*.msi
      - name: Upload Linux DEB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-Linux-${{ runner.arch }}-DEB
          path: target/release/bundle/deb/*.deb
      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-Linux-${{ runner.arch }}-AppImage
          path: target/release/bundle/appimage/*.AppImage
