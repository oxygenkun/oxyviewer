name: CI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  lint:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true
      - uses: ilammy/setup-nasm@v1
      - name: Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_INCREMENTAL: 1
      - name: cargo test
        run: cargo test --workspace
        env:
          CARGO_INCREMENTAL: 1

  frontend:
    name: Format and frontend checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  build:
    name: Build (${{ matrix.os }})
    # Manual Windows builds can proceed when the release-only checks are skipped.
    # Releases require both checks to succeed; cancellation never starts a build.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
        needs.lint.result == 'success' && needs.frontend.result == 'success'))
    needs: [lint, frontend]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest"]' || '["macos-latest", "windows-latest", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Windows FFmpeg build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make diffutils nasm mingw-w64-ucrt-x86_64-gcc
      - name: Configure Windows FFmpeg shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OXY_FFMPEG_BASH=${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe" >> $env:GITHUB_ENV'
      - name: Restore FFmpeg build cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/ffmpeg
            apps/desktop/src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('3rdpart/ffmpeg/source.json', '3rdpart/ffmpeg/build.sh', '3rdpart/ffmpeg/prepare.mjs') }}
      - name: Identify Windows native toolchain
        id: native-toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgCommit = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify vcpkg revision' }
          "revision=$vcpkgCommit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Windows dependency cache
        id: vcpkg-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: vcpkg-binary-cache
          # vcpkg ABI changes with its ports, the compiler, and our overlay.
          # An exact hit on an obsolete fixed key cannot save rebuilt packages.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.image }}-${{ steps.native-toolchain.outputs.revision }}-${{ hashFiles('3rdpart/vcpkg-ports/**') }}-core-static-md
      - name: Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif[core]:x64-windows-static-md" --overlay-ports="${{ github.workspace }}\3rdpart\vcpkg-ports"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed: $LASTEXITCODE" }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Save Windows dependency cache
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          # Isolate Windows link metadata by the same native inputs as vcpkg,
          # avoiding both stale link flags and unconditional cargo clean.
          key: ${{ runner.os == 'Windows' && format('native-{0}-{1}-{2}-core-static-md', steps.native-toolchain.outputs.image, steps.native-toolchain.outputs.revision, hashFiles('3rdpart/vcpkg-ports/**')) || '' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cross-platform HIF detail and media regression tests
        # The lint job already tests the full workspace on this Linux image.
        if: runner.os != 'Linux'
        run: cargo test -p oxy-media -p oxy-metadata -p oxyviewer
      - name: Prepare and verify FFmpeg
        run: pnpm ffmpeg:prepare
      - name: Save FFmpeg build cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/ffmpeg
            apps/desktop/src-tauri/binaries
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Build Tauri app
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: pnpm tauri build
      - name: Build Tauri app (DMG)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app,dmg
      - name: Build Tauri app (MSI)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: pnpm tauri build --bundles msi
      - name: Verify macOS app FFmpeg payload
        if: runner.os == 'macOS'
        run: node 3rdpart/ffmpeg/prepare.mjs --verify-bundle target/release/bundle/macos/OxyViewer.app
      - name: Verify Windows MSI FFmpeg payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'oxy-msi-extracted'
          $process = Start-Process msiexec.exe -ArgumentList @('/a', "`"$installer`"", '/qn', "TARGETDIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
          node 3rdpart/ffmpeg/prepare.mjs --verify-bundle "$destination"
      - name: Verify Linux package FFmpeg payloads
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -x target/release/bundle/deb/*.deb "$RUNNER_TEMP/oxy-deb"
          node 3rdpart/ffmpeg/prepare.mjs --verify-bundle "$RUNNER_TEMP/oxy-deb"
          appimage=$(realpath target/release/bundle/appimage/*.AppImage)
          mkdir -p "$RUNNER_TEMP/oxy-appimage"
          cd "$RUNNER_TEMP/oxy-appimage"
          "$appimage" --appimage-extract > /dev/null
          node "$GITHUB_WORKSPACE/3rdpart/ffmpeg/prepare.mjs" --verify-bundle squashfs-root
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-macOS-${{ runner.arch }}-DMG
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
          path: target/release/bundle/dmg/*.dmg
      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-Windows-${{ runner.arch }}-MSI
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
          path: target/release/bundle/msi/*.msi
      - name: Upload Linux DEB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-Linux-${{ runner.arch }}-DEB
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
          path: target/release/bundle/deb/*.deb
      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OxyViewer-Linux-${{ runner.arch }}-AppImage
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
          path: target/release/bundle/appimage/*.AppImage

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: OxyViewer-*
          path: release-assets
          merge-multiple: true
      - name: Verify installer set
        shell: bash
        run: |
          shopt -s nullglob
          for extension in dmg msi deb AppImage; do
            installers=(release-assets/*."$extension")
            if [ "${#installers[@]}" -ne 1 ]; then
              echo "Expected one .$extension installer, found ${#installers[@]}" >&2
              exit 1
            fi
          done
      - name: Add platform names to installers
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          : > release-assets/.legacy-installer-names

          rename_installer() {
            local source="$1"
            local platform="$2"
            local old_name suffix
            old_name=$(basename "$source")
            suffix="${old_name#OxyViewer_${version}_}"
            if [ "$suffix" = "$old_name" ]; then
              echo "Unexpected installer name: $old_name" >&2
              exit 1
            fi
            printf '%s\n' "$old_name" >> release-assets/.legacy-installer-names
            mv "$source" "release-assets/OxyViewer_${version}_${platform}_${suffix}"
          }

          rename_installer release-assets/*.dmg macOS
          rename_installer release-assets/*.msi Windows
          rename_installer release-assets/*.deb Linux
          rename_installer release-assets/*.AppImage Linux
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.msi release-assets/*.deb release-assets/*.AppImage)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            while IFS= read -r legacy_asset; do
              if gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' | grep -Fqx "$legacy_asset"; then
                gh release delete-asset "$GITHUB_REF_NAME" "$legacy_asset" \
                  --yes \
                  --repo "$GITHUB_REPOSITORY"
              fi
            done < release-assets/.legacy-installer-names
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "OxyViewer $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
